<script type="text/babel" data-presets="react">
const { useState, useId, useEffect, useMemo } = React;

/* ================= utilitários (no projeto: lib/utils.ts com clsx + tailwind-merge) ================= */
// Versão simplificada do cn(): junta as classes e, em conflito óbvio, a última vence.
function cn(...args) {
  const list = args.flat().filter(Boolean).join(" ").split(/\s+/).filter(Boolean);
  const key = (c) => {
    const parts = c.split(":"); const base = parts.pop(); const pre = parts.join(":");
    const m = base.match(/^(bg|rounded|shadow|gap|h|w|px|py|p|border-l|justify|items)(-|$)/);
    if (!m) return null;
    if (m[1] === "bg" && /^bg-(clip|origin|repeat|no-repeat|fixed|cover|contain)/.test(base)) return null;
    return pre + "|" + m[1];
  };
  const seen = new Map();
  list.forEach((c, i) => { const k = key(c); if (k) seen.set(k, i); });
  return list.filter((c, i) => { const k = key(c); return !k || seen.get(k) === i; }).join(" ");
}

/* ================= componentes shadcn/ui (classes do shadcn, tema The Senses) =================
   Ajustes da marca: sem sombras (shadow-xs/shadow-sm removidas), Card com rounded-lg (4px). */

const buttonVariants = {
  base: "inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 aria-invalid:border-destructive",
  variant: {
    default: "bg-primary text-primary-foreground hover:bg-primary/90",
    destructive: "bg-destructive text-destructive-foreground hover:bg-destructive/90 focus-visible:ring-destructive/20",
    outline: "border bg-background hover:bg-accent hover:text-accent-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50",
    secondary: "bg-secondary text-secondary-foreground hover:bg-secondary/80",
    ghost: "hover:bg-accent hover:text-accent-foreground dark:hover:bg-accent/50",
    link: "text-primary underline-offset-4 hover:underline",
  },
  size: {
    default: "h-9 px-4 py-2 has-[>svg]:px-3",
    sm: "h-8 rounded-md gap-1.5 px-3 has-[>svg]:px-2.5",
    lg: "h-10 rounded-md px-6 has-[>svg]:px-4",
    icon: "size-9",
  },
};
function Button({ className, variant = "default", size = "default", type = "button", ...props }) {
  return <button data-slot="button" type={type} className={cn(buttonVariants.base, buttonVariants.variant[variant], buttonVariants.size[size], className)} {...props} />;
}

const badgeVariants = {
  base: "inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 [&>svg]:size-3 gap-1 [&>svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] transition-[color,box-shadow] overflow-hidden",
  variant: {
    default: "border-transparent bg-primary text-primary-foreground",
    secondary: "border-transparent bg-secondary text-secondary-foreground",
    destructive: "border-transparent bg-destructive text-destructive-foreground",
    outline: "text-foreground border-input",
  },
};
function Badge({ className, variant = "default", ...props }) {
  return <span data-slot="badge" className={cn(badgeVariants.base, badgeVariants.variant[variant], className)} {...props} />;
}

function Card({ className, ...props }) {
  return <div data-slot="card" className={cn("bg-card text-card-foreground flex flex-col gap-6 rounded-lg border py-6", className)} {...props} />;
}
function CardHeader({ className, ...props }) {
  return <div data-slot="card-header" className={cn("@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-1.5 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6", className)} {...props} />;
}
function CardTitle({ className, ...props }) {
  return <div data-slot="card-title" className={cn("font-display leading-none font-semibold", className)} {...props} />;
}
function CardDescription({ className, ...props }) {
  return <div data-slot="card-description" className={cn("text-muted-foreground text-sm", className)} {...props} />;
}
function CardAction({ className, ...props }) {
  return <div data-slot="card-action" className={cn("col-start-2 row-span-2 row-start-1 self-start justify-self-end", className)} {...props} />;
}
function CardContent({ className, ...props }) {
  return <div data-slot="card-content" className={cn("px-6", className)} {...props} />;
}
function CardFooter({ className, ...props }) {
  return <div data-slot="card-footer" className={cn("flex items-center px-6 [.border-t]:pt-6", className)} {...props} />;
}

function Label({ className, ...props }) {
  return <label data-slot="label" className={cn("flex items-center gap-2 text-sm leading-none font-medium select-none peer-disabled:cursor-not-allowed peer-disabled:opacity-50", className)} {...props} />;
}
function Input({ className, type, ...props }) {
  return (
    <input
      type={type}
      data-slot="input"
      className={cn(
        "file:text-foreground placeholder:text-muted-foreground selection:bg-primary selection:text-primary-foreground dark:bg-input/30 border-input flex h-9 w-full min-w-0 rounded-md border bg-transparent px-3 py-1 text-base transition-[color,box-shadow] outline-none disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm",
        "focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px]",
        "aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive",
        className
      )}
      {...props}
    />
  );
}

function Separator({ className, orientation = "horizontal", ...props }) {
  return <div role="separator" data-slot="separator" data-orientation={orientation} className={cn("bg-border shrink-0", orientation === "horizontal" ? "h-px w-full" : "h-full w-px", className)} {...props} />;
}

function Checkbox({ checked, onCheckedChange, id, className, ...props }) {
  return (
    <button
      type="button" role="checkbox" id={id} aria-checked={checked} data-state={checked ? "checked" : "unchecked"}
      onClick={() => onCheckedChange?.(!checked)}
      data-slot="checkbox"
      className={cn("peer border-input dark:bg-input/30 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground data-[state=checked]:border-primary focus-visible:border-ring focus-visible:ring-ring/50 size-4 shrink-0 rounded-[4px] border transition-shadow outline-none focus-visible:ring-[3px] inline-flex items-center justify-center", className)}
      {...props}
    >
      {checked && <svg viewBox="0 0 24 24" className="size-3.5" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>}
    </button>
  );
}

// Tabs (no projeto vem do Radix; aqui o comportamento é simulado)
function Tabs({ value, onValueChange, className, children }) {
  return <div data-slot="tabs" className={cn("flex flex-col gap-2", className)}>{React.Children.map(children, (c) => React.cloneElement(c, { value, onValueChange }))}</div>;
}
function TabsList({ className, children, value, onValueChange }) {
  return (
    <div role="tablist" data-slot="tabs-list" className={cn("bg-muted text-muted-foreground inline-flex h-9 w-fit items-center justify-center rounded-lg p-[3px]", className)}>
      {React.Children.map(children, (c) => React.cloneElement(c, { current: value, onValueChange }))}
    </div>
  );
}
function TabsTrigger({ className, value, current, onValueChange, children }) {
  const active = value === current;
  return (
    <button
      type="button" role="tab" aria-selected={active} data-state={active ? "active" : "inactive"} data-slot="tabs-trigger"
      onClick={() => onValueChange(value)}
      className={cn("data-[state=active]:bg-background dark:data-[state=active]:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:outline-ring dark:data-[state=active]:border-input dark:data-[state=active]:bg-input/30 text-foreground dark:text-muted-foreground inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-2 py-1 text-sm font-medium whitespace-nowrap transition-[color,box-shadow] focus-visible:ring-[3px] focus-visible:outline-1 disabled:pointer-events-none disabled:opacity-50", className)}
    >
      {children}
    </button>
  );
}

// Toggle Group, variante outline (no projeto vem do Radix)
function ToggleGroup({ value, onValueChange, options, size = "sm", className, label }) {
  return (
    <div role="radiogroup" aria-label={label} data-slot="toggle-group" data-variant="outline" className={cn("group/toggle-group flex w-fit items-center rounded-md", className)}>
      {options.map((o) => {
        const on = o.value === value;
        return (
          <button
            key={o.value} type="button" role="radio" aria-checked={on} data-state={on ? "on" : "off"} data-variant="outline" data-slot="toggle-group-item"
            onClick={() => onValueChange(o.value)}
            className={cn(
              "inline-flex items-center justify-center gap-2 text-sm font-medium hover:bg-muted hover:text-muted-foreground disabled:pointer-events-none disabled:opacity-50 data-[state=on]:bg-accent data-[state=on]:text-accent-foreground outline-none transition-[color,box-shadow] focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] whitespace-nowrap tnum",
              "border border-input bg-transparent hover:bg-accent hover:text-accent-foreground",
              size === "sm" ? "h-8 px-2.5 min-w-8" : "h-9 px-3 min-w-9",
              "min-w-0 flex-1 shrink-0 rounded-none first:rounded-l-md last:rounded-r-md focus:z-10 focus-visible:z-10 border-l-0 first:border-l"
            )}
          >
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

// Tooltip (no projeto vem do Radix). Abre com mouse, foco ou toque.
function Tooltip({ content, children }) {
  const [open, setOpen] = useState(false);
  const id = useId();
  return (
    <span className="relative inline-flex" onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)}>
      {React.cloneElement(children, {
        "aria-describedby": open ? id : undefined,
        onFocus: () => setOpen(true),
        onBlur: () => setOpen(false),
        onClick: () => setOpen((o) => !o),
        onKeyDown: (e) => { if (e.key === "Escape") setOpen(false); },
      })}
      {open && (
        <span role="tooltip" id={id} data-slot="tooltip-content"
          className="bg-foreground text-background absolute left-1/2 top-full z-50 mt-2 w-72 max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-md px-3 py-2 text-xs leading-relaxed text-left font-normal shadow-md">
          {content}
        </span>
      )}
    </span>
  );
}

function Campo({ children }) {
  return <code className="rounded-sm bg-background/20 px-1 font-mono text-[11px]">{children}</code>;
}

// Filtro facetado do data table do shadcn (Popover + Command no projeto).
function FiltroFacetado({ titulo, opcoes, selecionados, onChange }) {
  const [aberto, setAberto] = useState(false);
  const ref = React.useRef(null);
  useEffect(() => {
    if (!aberto) return;
    const fora = (e) => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
    const esc = (e) => { if (e.key === "Escape") setAberto(false); };
    document.addEventListener("mousedown", fora);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", fora); document.removeEventListener("keydown", esc); };
  }, [aberto]);
  const alternar = (v) => onChange(selecionados.includes(v) ? selecionados.filter((x) => x !== v) : [...selecionados, v]);
  return (
    <div className="relative" ref={ref}>
      <Button variant="outline" size="sm" className="h-8 border-dashed" aria-expanded={aberto} onClick={() => setAberto((a) => !a)}>
        <PlusCircle />
        {titulo}
        {selecionados.length > 0 && (
          <>
            <Separator orientation="vertical" className="mx-1 h-4" />
            {selecionados.map((v) => (
              <Badge key={v} variant="secondary" className="rounded-sm px-1 font-normal">{opcoes.find((o) => o.value === v)?.label}</Badge>
            ))}
          </>
        )}
      </Button>
      {aberto && (
        <div role="listbox" aria-multiselectable="true" className="bg-popover text-popover-foreground absolute left-0 top-full z-50 mt-1 w-52 rounded-md border p-1 shadow-md">
          {opcoes.map((o) => {
            const on = selecionados.includes(o.value);
            return (
              <button key={o.value} type="button" role="option" aria-selected={on} onClick={() => alternar(o.value)}
                className="flex w-full items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none hover:bg-accent focus-visible:bg-accent">
                <span className={cn("flex size-4 items-center justify-center rounded-[4px] border border-input", on ? "bg-primary border-primary text-primary-foreground" : "")}>
                  {on && <Check className="size-3" />}
                </span>
                <span>{o.label}</span>
                <span className="ml-auto text-xs text-muted-foreground tnum">{o.count}</span>
              </button>
            );
          })}
          {selecionados.length > 0 && (
            <>
              <Separator className="my-1" />
              <button type="button" onClick={() => onChange([])} className="w-full rounded-sm px-2 py-1.5 text-center text-sm hover:bg-accent">Limpar filtro</button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function Table({ className, ...props }) {
  return <div data-slot="table-container" className="relative w-full overflow-x-auto"><table data-slot="table" className={cn("w-full caption-bottom text-sm", className)} {...props} /></div>;
}
const TableHeader = ({ className, ...p }) => <thead data-slot="table-header" className={cn("[&_tr]:border-b", className)} {...p} />;
const TableBody = ({ className, ...p }) => <tbody data-slot="table-body" className={cn("[&_tr:last-child]:border-0", className)} {...p} />;
const TableRow = ({ className, ...p }) => <tr data-slot="table-row" className={cn("hover:bg-muted/50 data-[state=selected]:bg-muted border-b transition-colors", className)} {...p} />;
const TableHead = ({ className, ...p }) => <th data-slot="table-head" className={cn("text-foreground h-10 px-2 text-left align-middle font-medium whitespace-nowrap", className)} {...p} />;
const TableCell = ({ className, ...p }) => <td data-slot="table-cell" className={cn("p-2 align-middle whitespace-nowrap", className)} {...p} />;

/* ================= ícones (no projeto: lucide-react) ================= */
const Icon = ({ d, className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{d}</svg>;
const ArrowUp = (p) => <Icon {...p} d={<><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></>} />;

const RefreshCw = (p) => <Icon {...p} d={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></>} />;
const Sun = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></>} />;
const Moon = (p) => <Icon {...p} d={<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />} />;
const Monitor = (p) => <Icon {...p} d={<><rect width="20" height="14" x="2" y="3" rx="2" /><path d="M8 21h8M12 17v4" /></>} />;

const Info = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></>} />;
const PlusCircle = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><path d="M8 12h8M12 8v8" /></>} />;
const Check = (p) => <Icon {...p} d={<path d="M20 6 9 17l-5-5" />} />;
const Copy = (p) => <Icon {...p} d={<><rect width="14" height="14" x="8" y="8" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></>} />;

/* ================= dados de exemplo (inventados) ================= */
const MESES = ["nov/25", "dez/25", "jan/26", "fev/26", "mar/26", "abr/26", "mai/26", "jun/26", "jul/26", "ago/26", "set/26", "out/26"];
const HOJE = { dia: 12, diasNoMes: 31 };
const TIPOS = [
  { key: "nova", nome: "Nova venda", cor: "var(--chart-1)" },
  { key: "renov", nome: "Renovação", cor: "var(--chart-2)" },
  { key: "remat", nome: "Rematrícula", cor: "var(--chart-3)" },
  { key: "outras", nome: "Outras vendas", cor: "var(--chart-4)" },
];
const ENTRADAS = {

function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

  const bw = step * 0.62;
  const x = (i) => L + step * i + (step - bw) / 2;
  const mm = fechados.map((i) => (i < 2 ? null : media([totalMes(i), totalMes(i - 1), totalMes(i - 2)])));
  const pts = mm.map((v, i) => (v == null ? null : `${x(i) + bw / 2},${y(v)}`)).filter(Boolean).join(" ");

/* ================= peças das telas ================= */
/** Variação contra o período anterior. A seta mostra a direção; a cor e a palavra mostram se foi bom ou ruim.
    melhor="maior": subir é bom (entradas, saldo). melhor="menor": cair é bom (saídas, churn). */
function Variacao({ atual, anterior, rotulo, formato = "num", melhor = "maior" }) {
  const dif = formato === "pct" ? (atual - anterior) * 100 : anterior ? ((atual - anterior) / anterior) * 100 : 0;
  const dir = Math.abs(dif) < 0.05 ? "flat" : dif > 0 ? "up" : "down";
  const bom = dir === "flat" ? null : (dir === "up") === (melhor === "maior");
  const Seta = dir === "up" ? ArrowUp : dir === "down" ? ArrowDown : Minus;
  const txt = `${Math.abs(dif).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}${formato === "pct" ? " p.p." : "%"}`;
  const estilo = bom == null
    ? "border-input text-foreground"
    : bom ? "border-transparent bg-primary text-primary-foreground" : "border-transparent bg-destructive text-destructive-foreground";
  return (
    <div className="flex flex-wrap items-center gap-2 text-sm text-muted-foreground tnum">
      <Badge variant="outline" className={estilo}>
        <Seta />{dir === "flat" ? "Igual" : txt}
      </Badge>
      <span>{rotulo}</span>
    </div>
  );
}

/** Variação compacta para listas: seta + %, na cor de bom (Tiffany escuro) ou ruim (vermelho). */
function VariacaoMini({ atual, anterior, melhor = "maior", formato = "num" }) {
  const dif = formato === "pct" ? (atual - anterior) * 100 : anterior ? ((atual - anterior) / anterior) * 100 : 0;
  const dir = Math.abs(dif) < 0.05 ? "flat" : dif > 0 ? "up" : "down";
  const bom = dir === "flat" ? null : (dir === "up") === (melhor === "maior");
  const Seta = dir === "up" ? ArrowUp : dir === "down" ? ArrowDown : Minus;
  return (
    <span className={cn("inline-flex items-center gap-0.5 text-xs font-medium tnum", bom == null ? "text-muted-foreground" : bom ? "text-chart-5" : "text-destructive")}>
      <Seta className="size-3" />{dir === "flat" ? "0%" : `${Math.abs(dif).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}${formato === "pct" ? " p.p." : "%"}`}
    </span>
  );
}

function Metrica({ rotulo, valor, seta, info, children }) {
  const S = seta === "up" ? ArrowUp : seta === "down" ? ArrowDown : null;
  return (
    <div className="flex flex-col gap-2 min-w-0">
      <span className="text-sm text-muted-foreground inline-flex items-center gap-1.5">
        {rotulo}
        {info && (

              <Info className="size-4" />
            </button>
          </Tooltip>
        )}
      </span>
      <span className="font-display text-3xl font-semibold tnum inline-flex items-center gap-2">{S && <S className="size-6" />}{valor}</span>
      {children}
    </div>
  );
}

function Palco({ children, codigo }) {
  const [copiado, setCopiado] = useState(false);
  function copiar() {
    navigator.clipboard?.writeText(codigo).then(() => { setCopiado(true); setTimeout(() => setCopiado(false), 1500); }).catch(() => {});
  }
  return (
    <div className="flex flex-col gap-4 min-w-0">
      <div className="rounded-lg border p-10 flex items-center justify-center min-h-48 bg-background">{children}</div>
      <div className="rounded-lg bg-muted p-4 flex items-start justify-between gap-4">
        <pre className="text-sm overflow-x-auto min-w-0"><code>{codigo}</code></pre>
        <Button size="sm" variant="ghost" onClick={copiar}><Copy />{copiado ? "Copiado" : "Copiar"}</Button>
      </div>
    </div>
  );
}

function Opcoes({ id, label, valores, valor, onChange }) {

  );
}

function useTema() {
  const [tema, setTema] = useState(() => { try { return localStorage.getItem("tema") || "sistema"; } catch { return "sistema"; } });
  const [sistemaEscuro, setSistemaEscuro] = useState(() => matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const f = (e) => setSistemaEscuro(e.matches);
    mq.addEventListener("change", f);
    return () => mq.removeEventListener("change", f);
  }, []);
  useEffect(() => {
    const r = document.documentElement;
    if (tema === "sistema") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", tema === "escuro" ? "dark" : "light");
    try { localStorage.setItem("tema", tema); } catch {}
  }, [tema]);
  const escuro = tema === "escuro" || (tema === "sistema" && sistemaEscuro);
  return [tema, setTema, escuro];
}
