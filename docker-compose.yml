name: cockpit  # nome fixo, independe do nome da pasta

services:
  db:
    image: postgres:16
    environment:
      # valores vêm do .env (ver .env.example)
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    ports:
      # só acessível desta máquina, não pela rede
      - "127.0.0.1:5432:5432"
    volumes:
      # dados fora do container: sobrevivem ao docker compose down
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrations pendentes e termina. O app só sobe depois dele.
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      # dentro do compose o banco é o host `db`, não localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # sem valor aqui o app recusa subir e diz o que falta (src/backend/config/env.ts)
      EVO_BASE_URL: ${EVO_BASE_URL:-}
      EVO_USERNAME: ${EVO_USERNAME:-}
      EVO_PASSWORD: ${EVO_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
    name: cockpit-db  # nome fixo do volume (docker volume ls)
